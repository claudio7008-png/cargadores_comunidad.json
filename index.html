<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa de Cargadores EV</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        
        #map {
            height: 75vh;
            min-height: 350px;
            width: 100%;
            background-color: #e5e3df;
        }

        .container { 
            padding: 10px 15px; 
            max-width: 600px;
            margin: 0 auto;
        }

        /* Botón principal de búsqueda de estación */
        .btn-buscar-estacion {
            background-color: #10B981;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-buscar-estacion:active {
            background-color: #059669;
            transform: scale(0.99);
        }

        .info-panel { 
            background: #ffffff; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            display: none; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .accordion-btn {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            padding: 12px 15px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .panel-form {
            padding: 0 15px;
            background-color: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .panel-form.open {
            padding: 15px;
            max-height: 500px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        button[type="submit"] { 
            background-color: #28a745; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 5px; 
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
        }

        .btn-borrar {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="container">
        <!-- Botón para activar la búsqueda y trazado -->
        <button id="btnBuscarEstacion" class="btn-buscar-estacion">
            ⚡ BUSCAR PRÓXIMA ESTACIÓN
        </button>

        <!-- Panel de información de la estación encontrada -->
        <div id="info-cercana" class="info-panel">
            <h3 style="margin-top:0;" id="cercana-titulo">Próxima estación más cercana:</h3>
            <p id="cercana-nombre"></p>
            <p id="cercana-distancia"></p>
        </div>

        <!-- Botón Desplegable -->
        <button id="btnToggleForm" class="accordion-btn">
            <span>➕ Agregar nueva estación</span>
            <span id="arrow">▼</span>
        </button>

        <!-- Formulario Colapsable -->
        <div id="formPanel" class="panel-form">
            <form id="formEstacion">
                <div class="form-group">
                    <label for="nombre">Nombre de la Estación:</label>
                    <input type="text" id="nombre" required placeholder="Ej: Cargador Shell YPF">
                </div>

                <div class="form-group">
                    <label for="latitud">Latitud:</label>
                    <input type="text" id="latitud" placeholder="Clic en el mapa" readonly required>
                </div>

                <div class="form-group">
                    <label for="longitud">Longitud:</label>
                    <input type="text" id="longitud" placeholder="Clic en el mapa" readonly required>
                </div>

                <div class="form-group">
                    <label for="tipoConector">Tipo de Conector:</label>
                    <input type="text" id="tipoConector" placeholder="Ej: Type 2 / CCS2 / Estándar">
                </div>

                <button type="submit">Guardar Estación</button>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([-38.416097, -63.616672], 5);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        setTimeout(() => { map.invalidateSize(); }, 500);

        let userMarker = null;
        let routePolyline = null;
        let listaEstaciones = [];
        let capasMarcadores = [];
        let currentLat = null;
        let currentLng = null;

        // --- ÍCONOS PERSONALIZADOS ---
        const estacionIcon = L.divIcon({
            className: 'custom-station-icon',
            html: `
                <div style="background-color: #10B981; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid white;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
        });

        const autoIcon = L.divIcon({
            className: 'custom-car-icon',
            html: `
                <div style="background-color: #007bff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4); border: 2px solid white; font-size: 20px;">
                    🚗
                </div>`,
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        // --- 1. SEGUIMIENTO GPS EN SEGUNDO PLANO (DINÁMICO) ---
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (posicion) => {
                    currentLat = posicion.coords.latitude;
                    currentLng = posicion.coords.longitude;

                    if (!userMarker) {
                        userMarker = L.marker([currentLat, currentLng], { icon: autoIcon })
                            .addTo(map)
                            .bindPopup("<b>🚗 Tu vehículo</b>");
                    } else {
                        userMarker.setLatLng([currentLat, currentLng]);
                    }
                },
                (err) => {
                    console.warn("Error o esperando señal GPS...", err);
                },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }

        // --- 2. MANEJO DEL ACORDEÓN ---
        const btnToggleForm = document.getElementById('btnToggleForm');
        const formPanel = document.getElementById('formPanel');
        const arrow = document.getElementById('arrow');

        btnToggleForm.addEventListener('click', function() {
            formPanel.classList.toggle('open');
            arrow.innerText = formPanel.classList.contains('open') ? '▲' : '▼';
        });

        // --- 3. CÁLCULO DE DISTANCIA ---
        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- 4. TRAZAR LÍNEA HASTA LA ESTACIÓN ---
        function trazarLinea(destinoLat, destinoLng, nombreEstacion, esMasCercana = false) {
            if (!currentLat || !currentLng) return;

            if (routePolyline) {
                map.removeLayer(routePolyline);
            }

            const latlngs = [
                [currentLat, currentLng],
                [destinoLat, destinoLng]
            ];

            routePolyline = L.polyline(latlngs, {
                color: '#007bff',
                weight: 5,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });

            const dist = calcularDistanciaKm(currentLat, currentLng, destinoLat, destinoLng).toFixed(2);
            document.getElementById('cercana-titulo').innerText = esMasCercana ? "Próxima estación más cercana:" : "Estación seleccionada:";
            document.getElementById('cercana-nombre').innerHTML = `<b>${nombreEstacion}</b>`;
            document.getElementById('cercana-distancia').innerText = `📍 Distancia: ${dist} km`;
            document.getElementById('info-cercana').style.display = 'block';
        }

        // --- 5. EVENTO DEL BOTÓN: BUSCAR PRÓXIMA ESTACIÓN ---
        document.getElementById('btnBuscarEstacion').addEventListener('click', function() {
            if (!currentLat || !currentLng) {
                alert("Obteniendo señal de GPS, aguardá un segundo e intentá de nuevo...");
                return;
            }

            if (listaEstaciones.length === 0) {
                alert("No hay estaciones cargadas en el mapa.");
                return;
            }

            let estacionCercana = null;
            let menorDistancia = Infinity;

            listaEstaciones.forEach(estacion => {
                if (estacion.latitud && estacion.longitud) {
                    const d = calcularDistanciaKm(currentLat, currentLng, estacion.latitud, estacion.longitud);
                    if (d < menorDistancia) {
                        menorDistancia = d;
                        estacionCercana = estacion;
                    }
                }
            });

            if (estacionCercana) {
                trazarLinea(estacionCercana.latitud, estacionCercana.longitud, estacionCercana.nombre, true);
            }
        });

        // --- 6. AGREGAR MARCADORES AL MAPA ---
        function agregarMarcadorMapa(estacion) {
            const marker = L.marker([estacion.latitud, estacion.longitud], { icon: estacionIcon }).addTo(map);
            
            const contenidoPopup = `
                <b>${estacion.nombre}</b><br>
                <strong>Conector:</strong> ${estacion.tipoConector || 'No especificado'}<br>
                <button class="btn-borrar" onclick="eliminarEstacion(${estacion.latitud}, ${estacion.longitud})">🗑️ Borrar estación</button>
            `;
            
            marker.bindPopup(contenidoPopup);

            marker.on('click', function() {
                if (currentLat && currentLng) {
                    trazarLinea(estacion.latitud, estacion.longitud, estacion.nombre, false);
                }
            });

            capasMarcadores.push({ latitud: estacion.latitud, longitud: estacion.longitud, layer: marker });
        }

        async function eliminarEstacion(latitud, longitud) {
            if (!confirm("¿Deseas eliminar esta estación?")) return;
            if (!confirm("⚠️ ¿CONFIRMAR BORRADO DE ESTACIÓN? Esta acción no se puede deshacer.")) return;

            try {
                const response = await fetch('/api/estaciones', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitud, longitud })
                });

                if (response.ok) {
                    alert("Estación eliminada con éxito.");
                    const indice = capasMarcadores.findIndex(m => m.latitud === latitud && m.longitud === longitud);
                    if (indice !== -1) {
                        map.removeLayer(capasMarcadores[indice].layer);
                        capasMarcadores.splice(indice, 1);
                    }
                    if (routePolyline) map.removeLayer(routePolyline);
                    document.getElementById('info-cercana').style.display = 'none';
                    listaEstaciones = listaEstaciones.filter(e => !(e.latitud === latitud && e.longitud === longitud));
                } else {
                    alert("Error al intentar eliminar la estación.");
                }
            } catch (error) {
                console.error("Error conectando con el servidor:", error);
            }
        }

        async function cargarEstaciones() {
            try {
                const response = await fetch('/api/estaciones');
                listaEstaciones = await response.json();

                listaEstaciones.forEach(estacion => {
                    if (estacion.latitud && estacion.longitud) {
                        agregarMarcadorMapa(estacion);
                    }
                });
            } catch (error) {
                console.error("Error al cargar estaciones:", error);
            }
        }

        map.on('click', function(e) {
            document.getElementById('latitud').value = e.latlng.lat.toFixed(6);
            document.getElementById('longitud').value = e.latlng.lng.toFixed(6);
            
            if (!formPanel.classList.contains('open')) {
                formPanel.classList.add('open');
                arrow.innerText = '▲';
            }
        });

        document.getElementById('formEstacion').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nuevaEstacion = {
                nombre: document.getElementById('nombre').value,
                latitud: parseFloat(document.getElementById('latitud').value),
                longitud: parseFloat(document.getElementById('longitud').value),
                tipoConector: document.getElementById('tipoConector').value
            };

            try {
                const response = await fetch('/api/estaciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaEstacion)
                });

                if (response.ok) {
                    alert("¡Estación guardada exitosamente!");
                    agregarMarcadorMapa(nuevaEstacion);
                    listaEstaciones.push(nuevaEstacion);
                    document.getElementById('formEstacion').reset();
                    formPanel.classList.remove('open');
                    arrow.innerText = '▼';
                } else {
                    alert("Error al guardar la estación.");
                }
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
            }
        });

        cargarEstaciones();
    </script>
</body>
</html>
