<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Cargadores EV</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 70vh; width: 100%; }
        .container { padding: 15px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; width: 100%; margin-top: 5px; }
        button:hover { background-color: #0056b3; }
        .info-panel { background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: none; }
        .user-location-marker {
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="container">
        <button id="btnGps">📍 Ubicarme y buscar estación más cercana</button>

        <div id="info-cercana" class="info-panel">
            <h3>Estación más cercana:</h3>
            <p id="cercana-nombre"></p>
            <p id="cercana-distancia"></p>
            <p id="cercana-tiempo"></p>
        </div>

        <h3>Agregar nueva estación</h3>
        <form id="formEstacion">
            <div class="form-group">
                <label for="nombre">Nombre de la Estación:</label>
                <input type="text" id="nombre" required placeholder="Ej: Cargador Shell YPF">
            </div>

            <div class="form-group">
                <label for="latitud">Latitud:</label>
                <input type="text" id="latitud" placeholder="Clic en el mapa" readonly required>
            </div>

            <div class="form-group">
                <label for="longitud">Longitud:</label>
                <input type="text" id="longitud" placeholder="Clic en el mapa" readonly required>
            </div>

            <div class="form-group">
                <label for="tipoConector">Tipo de Conector:</label>
                <input type="text" id="tipoConector" placeholder="Ej: Type 2 / CCS2 / Estándar">
            </div>

            <button type="submit">Guardar Estación</button>
        </form>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([-38.416097, -63.616672], 5);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        let userMarker = null;
        let accuracyCircle = null;
        let routeLayer = null;
        let listaEstaciones = [];

        function calcularDistanciaDirecta(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Cargar las estaciones desde nuestro servidor (Ruta relativa /api/estaciones)
        async function cargarEstaciones() {
            try {
                const response = await fetch('/api/estaciones');
                listaEstaciones = await response.json();

                listaEstaciones.forEach(estacion => {
                    if (estacion.latitud && estacion.longitud) {
                        L.marker([estacion.latitud, estacion.longitud])
                            .addTo(map)
                            .bindPopup(`
                                <b>${estacion.nombre}</b><br>
                                <strong>Conector:</strong> ${estacion.tipoConector || 'No especificado'}<br>
                                <strong>Origen:</strong> ${estacion.origen || 'Comunidad'}
                            `);
                    }
                });
            } catch (error) {
                console.error("Error al cargar estaciones:", error);
            }
        }

        // Capturar clics para el formulario
        map.on('click', function(e) {
            document.getElementById('latitud').value = e.latlng.lat.toFixed(6);
            document.getElementById('longitud').value = e.latlng.lng.toFixed(6);
        });

        // Guardar nueva estación (Ruta relativa /api/estaciones)
        document.getElementById('formEstacion').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nuevaEstacion = {
                nombre: document.getElementById('nombre').value,
                latitud: parseFloat(document.getElementById('latitud').value),
                longitud: parseFloat(document.getElementById('longitud').value),
                tipoConector: document.getElementById('tipoConector').value
            };

            try {
                const response = await fetch('/api/estaciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaEstacion)
                });

                if (response.ok) {
                    alert("¡Estación guardada exitosamente!");
                    L.marker([nuevaEstacion.latitud, nuevaEstacion.longitud])
                        .addTo(map)
                        .bindPopup(`<b>${nuevaEstacion.nombre}</b><br><strong>Conector:</strong> ${nuevaEstacion.tipoConector}`)
                        .openPopup();
                    
                    listaEstaciones.push(nuevaEstacion);
                    document.getElementById('formEstacion').reset();
                } else {
                    alert("Error al guardar la estación.");
                }
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
            }
        });

        // TRAZADO DE RUTA POR CALLES VIA OSRM
        async function trazarRutaCalles(userLat, userLng, destinoLat, destinoLng) {
            const url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${destinoLng},${destinoLat}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    const ruta = data.routes[0];
                    const distanciaKm = (ruta.distance / 1000).toFixed(2);
                    const tiempoMins = Math.round(ruta.duration / 60);

                    if (routeLayer) map.removeLayer(routeLayer);

                    routeLayer = L.geoJSON(ruta.geometry, {
                        style: {
                            color: '#007bff',
                            weight: 5,
                            opacity: 0.8
                        }
                    }).addTo(map);

                    let textoTiempo = "";
                    if (tiempoMins < 60) {
                        textoTiempo = `${tiempoMins} min en auto`;
                    } else {
                        const horas = Math.floor(tiempoMins / 60);
                        const minsRestantes = tiempoMins % 60;
                        textoTiempo = `${horas}h ${minsRestantes}m en auto`;
                    }

                    document.getElementById('cercana-distancia').innerText = `📍 Distancia por calles: ${distanciaKm} km`;
                    document.getElementById('cercana-tiempo').innerText = `🚗 Tiempo estimado: ${textoTiempo}`;
                }
            } catch (err) {
                console.error("Error al trazar la ruta OSRM:", err);
            }
        }

        // GEOLOCALIZACIÓN Y BÚSQUEDA
        function ubicarUsuario() {
            if (!navigator.geolocation) {
                alert("Tu navegador no soporta geolocalización.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (posicion) => {
                    const userLat = posicion.coords.latitude;
                    const userLng = posicion.coords.longitude;
                    const precision = posicion.coords.accuracy;

                    if (userMarker) map.removeLayer(userMarker);
                    if (accuracyCircle) map.removeLayer(accuracyCircle);

                    accuracyCircle = L.circle([userLat, userLng], {
                        radius: precision,
                        color: '#007bff',
                        fillColor: '#007bff',
                        fillOpacity: 0.15
                    }).addTo(map);

                    const userIcon = L.divIcon({
                        className: 'user-location-marker',
                        iconSize: [16, 16]
                    });

                    userMarker = L.marker([userLat, userLng], { icon: userIcon })
                        .addTo(map)
                        .bindPopup("<b>📍 Estás aquí</b>")
                        .openPopup();

                    map.flyTo([userLat, userLng], 13, { animate: true, duration: 1.5 });

                    // BUSCAR LA ESTACIÓN MÁS CERCANA
                    if (listaEstaciones.length > 0) {
                        let estacionMasCercana = null;
                        let menorDistancia = Infinity;

                        listaEstaciones.forEach(estacion => {
                            if (estacion.latitud && estacion.longitud) {
                                const dist = calcularDistanciaDirecta(userLat, userLng, estacion.latitud, estacion.longitud);
                                if (dist < menorDistancia) {
                                    menorDistancia = dist;
                                    estacionMasCercana = estacion;
                                }
                            }
                        });

                        if (estacionMasCercana) {
                            document.getElementById('cercana-nombre').innerHTML = `<b>${estacionMasCercana.nombre}</b>`;
                            document.getElementById('info-cercana').style.display = 'block';

                            await trazarRutaCalles(userLat, userLng, estacionMasCercana.latitud, estacionMasCercana.longitud);
                        }
                    }
                },
                (error) => {
                    alert("No se pudo obtener tu ubicación.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        document.getElementById('btnGps').addEventListener('click', ubicarUsuario);
        cargarEstaciones();
    </script>
</body>
</html>
